name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        env:
          # Public Meta Conversions API Function URL (repo Variable, not a
          # secret). Injected at build time; when unset the site silently
          # skips the server-side InitiateCheckout and only the browser pixel
          # fires. Set under Settings → Secrets and variables → Actions → Variables.
          VITE_CAPI_URL: ${{ vars.VITE_CAPI_URL }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cname: andthenwehitarock.com
          publish_dir: ./dist