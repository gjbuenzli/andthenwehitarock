AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Meta Conversions API relay for andthenwehitarock.com. A single Lambda behind a
  public Function URL that forwards InitiateCheckout events server-side to Meta.
  Stays within the AWS always-free tier (Lambda: 1M requests/mo).

Parameters:
  FbAccessToken:
    Type: String
    NoEcho: true
    Description: Conversions API access token from Events Manager (kept out of git).
  PixelId:
    Type: String
    Default: '4291041411181419'
    Description: Meta Pixel ID (must match the browser pixel for dedup).
  AllowOrigin:
    Type: CommaDelimitedList
    Default: 'https://andthenwehitarock.com,https://www.andthenwehitarock.com'
    Description: >
      Site origins allowed to call the endpoint (CORS). The site canonicalizes
      to the apex (andthenwehitarock.com), so the apex MUST be listed or real
      browsers CORS-block the server event; www is included for safety.
  TestEventCode:
    Type: String
    Default: ''
    Description: Optional Events Manager → Test Events code. Leave blank in prod.
  BudgetEmail:
    Type: String
    Description: Email to notify if this account's spend approaches $1/month.

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 128
    Timeout: 5

Resources:
  CapiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meta-capi-relay
      Handler: src/index.handler
      CodeUri: ./
      Description: Forwards InitiateCheckout to the Meta Conversions API (CORS owned by the Function URL layer).
      Environment:
        Variables:
          PIXEL_ID: !Ref PixelId
          FB_ACCESS_TOKEN: !Ref FbAccessToken
          TEST_EVENT_CODE: !Ref TestEventCode
      FunctionUrlConfig:
        AuthType: NONE
        # CORS is owned entirely by this layer (NOT the function code, which would
        # otherwise double-stamp Access-Control-Allow-Origin and get browser-
        # rejected). AllowOrigins covers the apex + www; the site canonicalizes
        # to the apex, so the apex MUST be present.
        Cors:
          AllowOrigins: !Ref AllowOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type

  # Safety net: alert (and give you a chance to react) if the account's monthly
  # spend nears $1. This tiny function should always be $0 within the free tier.
  SpendGuardBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: capi-relay-spend-guard
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: '1'
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  CapiUrl:
    Description: Public Function URL — put this in the site's VITE_CAPI_URL.
    Value: !GetAtt CapiFunctionUrl.FunctionUrl
